ontology:
  name: Currency
  namespace: bank_data.securities_domain
  version: "2.0"
  description: >
    `Currency` is a value object: the three-letter ISO 4217 alphabetic
    currency code (USD, EUR, CHF, …). Wherever a currency appears in the
    instrument or position ontologies (`currencyOfDenomination`,
    `listingCurrency`, `Price.currency`, `CurrencyAmount.currency`, …)
    it is this code string — not a nested object.

    The descriptive metadata that ISO 4217 attaches to each code
    (numeric code, name, minor units, display symbol, issuing country,
    monetary authority) lives in the *reference dataset* entity
    `CurrencyReferenceEntry` defined in `CurrencyReferenceData.yml`.
    Golden records hold the code; lookups go through the reference data.

    This separation mirrors how `LegalEntityIdentifier` (also a code
    string) and `CfiCode` are modelled, and matches the bundled example
    payloads which carry `"currencyOfDenomination": "USD"` rather than a
    nested object.

  entities:
    Currency:
      description: ISO 4217 alphabetic currency code.
      kind: value_object
      type: string
      pattern: "^[A-Z]{3}$"
      example: USD
