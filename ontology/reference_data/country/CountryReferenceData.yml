ontology:
  name: Country Reference Data
  version: 1.0.0
  description: >
    Reference dataset structure for ISO 3166-1 country codes. This file defines
    the canonical record shape and includes a starter set of common entries.

  entities:
    CountryReferenceEntry:
      description: Canonical reference-data entry for a country or territory.
      kind: reference_data
      type: object
      required:
        - code
        - name
      properties:
        code:
          type: Country
          description: ISO 3166-1 alpha-2 country code.
        name:
          type: string
          description: English short name of the country or territory.
        alpha3Code:
          type: string
          description: ISO 3166-1 alpha-3 country code.
          pattern: '^[A-Z]{3}$'
        numericCode:
          type: string
          description: ISO 3166-1 numeric country code.
          pattern: '^[0-9]{3}$'

