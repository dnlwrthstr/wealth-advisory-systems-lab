ontology:
  name: TotalReturnSwap
  version: 1.0.0
  description: >
    Ontology representation of the TotalReturnSwap financial instrument schema.
    TotalReturnSwap inherits from FinancialInstrument and introduces TRS-
    specific attributes including notional amount, funding rate, settlement
    details, and underlying asset identifiers.
  is a: FinancialInstrument
  common_ontology: "../../../../instrument_base/FinancialInstrument.yml#/ontology/entities/FinancialInstrument"

  entities:

    TotalReturnSwap:
      description: Total return swap contract.
      is_a: FinancialInstrument
      common_ontology: "../../../../instrument_base/FinancialInstrumentBase.yml#/ontology/entities/TotalReturnSwap"

      composition:
        all_of:
          - FinancialInstrument

      properties:
        underlyingId:
          description: Identifier of the underlying asset being swapped.
          type: string
          required: true

        notionalAmount:
          description: Face value of the underlying asset protected or swapped.
          required: true
          common_ontology: "../../../../instrument_base/FinancialInstrumentBase.yml#/ontology/entities/CurrencyAmount"

        fundingRate:
          description: Set rate paid to the payer (e.g., SOFR + spread).
          type: number
          format: decimal
          required: true

        paymentFrequency:
          description: Frequency of total return and funding leg settlements.
          type: string
          enum:
            - annual
            - monthly
            - quarterly
            - semi_annual
            - weekly
            - at_maturity
            - other
          required: true

        assetPerformance:
          description: Capital gains/losses plus income generated by the asset.
          type: number
          format: decimal
          required: true

        maturityDate:
          description: Final date the contract remains valid.
          required: true
          type: string
          format: date

        settlementType:
          description: Settlement method for the TRS cash flows.
          type: string
          enum:
            - cash
          required: true

        initialMargin:
          description: Collateral required to open the TRS raw_data.
          required: true
          common_ontology: "../../../../instrument_base/FinancialInstrumentBase.yml#/ontology/entities/CurrencyAmount"

        currency:
          description: ISO 4217 code for the TRS cash flows.
          required: true
          common_ontology: "../../../../instrument_base/FinancialInstrumentBase.yml#/ontology/entities/Currency"

        creditSupport:
          description: Credit support agreement governing collateral management.
          required: true
          common_ontology: "../../../../instrument_base/FinancialInstrumentBase.yml#/ontology/entities/CreditSupport"
