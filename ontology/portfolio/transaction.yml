ontology:
  name: Transaction
  version: 1.0.0
  source: "open_wealth_specification/Custody Services API.yaml"
  description: >
    Transaction entity and related definitions.

  entities:

    TransactionType:
      description: Type of the transaction.
      type: string
      enum:
        - buy
        - sell
        - dividend
        - interest
        - fee
        - tax
        - transfer_in
        - transfer_out
        - corporate_action
        - other
      example: buy

    PlaceOfTrade:
      description: Place where the trade was executed.
      properties:
        type:
          description: Type of the place of trade.
          type: string
          enum:
            - mic
            - bic
            - other
          example: mic

        value:
          description: Value of the place of trade.
          type: string
          example: XSWX

    MovementType:
      description: Indicates if the movement is a credit or a debit.
      type: string
      enum:
        - credit
        - debit
      example: credit

    Movement:
      description: Movement entity.
      properties:
        type:
          description: Type of the movement.
          ref: MovementType

        quantity:
          description: Quantity of the movement.
          common_ontology: "../instrument_base/FinancialInstrumentBase.yml#/ontology/entities/Quantity"

        account:
          description: Account of the movement.
          common_ontology: "./account.yml#/ontology/entities/Account"

        financialInstrument:
          description: Financial instrument of the movement.
          common_ontology: "../instrument_base/FinancialInstrument.yml#/ontology/entities/FinancialInstrument"

    PostingAmount:
      description: Posting amount entity.
      properties:
        type:
          description: Type of the posting amount.
          type: string
          enum:
            - net_amount
            - gross_amount
            - tax
            - fee
            - accrued_interest
            - other
          example: net_amount

        amount:
          description: Amount of the posting.
          common_ontology: "../instrument_base/FinancialInstrumentBase.yml#/ontology/entities/CurrencyAmount"

    Transaction:
      description: Transaction entity.
      properties:
        id:
          description: Unique transaction identifier.
          type: string
          maxLength: 128
          example: 123456789

        type:
          description: Type of the transaction.
          ref: TransactionType

        transactionDate:
          description: Date on which the transaction was booked.
          type: string
          format: date

        customerId:
          description: Customer (business partner) identifier.
          type: string
          maxLength: 128
          example: MTIzNDUtNg

        reversalIndicator:
          description: Indicates whether this transaction is a reversal.
          type: boolean

        endOfDayIndicator:
          description: Indicates whether this transaction is an end-of-day booking.
          type: boolean

        reference:
          description: Bank reference or transaction reference.
          type: string
          maxLength: 70
          example: REF123456

        description:
          description: Human-readable transaction description.
          type: string
          maxLength: 140
          example: Purchase of 100 Stark Industries Inc.

        placeOfTrade:
          description: Trading venue or market where the transaction occurred.
          ref: PlaceOfTrade

        reversedTransactionId:
          description: Reference to the transaction that was reversed.
          type: string
          maxLength: 128
          example: 987654321

        tradeDate:
          description: Trade execution date.
          type: string
          format: date

        settlementDate:
          description: Settlement (value) date.
          type: string
          format: date

        triggeringFinancialInstrument:
          description: Instrument that triggered the transaction.
          common_ontology: "../instrument_base/FinancialInstrument.yml#/ontology/entities/FinancialInstrument"

        triggeringQuantity:
          description: Quantity of the instrument involved.
          common_ontology: "../instrument_base/FinancialInstrumentBase.yml#/ontology/entities/Quantity"

        triggeringPrice:
          description: Price at which the instrument was traded.
          common_ontology: "../instrument_base/FinancialInstrumentBase.yml#/ontology/entities/Price"

        movementList:
          description: List of security or cash movements generated by the transaction.
          type: array
          items:
            ref: Movement

        postingAmountList:
          description: List of posted amounts resulting from the transaction.
          type: array
          items:
            ref: PostingAmount

        settlementCurrency:
          description: Currency in which settlement took place.
          common_ontology: "../instrument_base/FinancialInstrumentBase.yml#/ontology/entities/Currency"

        additionalDetails:
          description: Free-text additional transaction information.
          type: string
          maxLength: 1000
          example: Additional info
