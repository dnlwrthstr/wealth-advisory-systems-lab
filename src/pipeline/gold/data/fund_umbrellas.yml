# Curated UCITS umbrella LEIs for FundGolden sample-data generation.
#
# A UCITS fund umbrella is the legal entity that contains one or more
# sub-funds; FIRDS reports the umbrella's LEI as the instrument's `lei`.
# The management company is a separate legal entity (BlackRock Asset
# Management Ireland Ltd, Amundi Asset Management, etc.) and is captured
# in the `managementCompany` field below so the FundGolden record can
# express both the umbrella and the manager.
#
# Verified by querying a known ETF ISIN from each family against ESMA FIRDS.

issuers:

  # --- iShares (BlackRock) UCITS umbrellas ----------------------------------
  - lei: "549300QS4Q1IT6XCA514"
    umbrellaName: "iShares III plc"
    managementCompany: "BlackRock Asset Management Ireland Limited"
    country: "IE"
    legalFramework: "UCITS"
    legalStructure: "Plc"

  - lei: "5493006ESS9BM09FB892"
    umbrellaName: "iShares VII plc"
    managementCompany: "BlackRock Asset Management Ireland Limited"
    country: "IE"
    legalFramework: "UCITS"
    legalStructure: "Plc"

