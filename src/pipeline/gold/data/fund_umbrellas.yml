# Curated UCITS umbrella records for FundGolden sample-data generation.
#
# UCITS funds have a five-level corporate hierarchy:
#
#   1. PROMOTER         — the group brand / sponsor (BlackRock, Inc.)
#   2. MANAGEMENT CO.   — the regulated operator (BlackRock Asset Management Ireland Ltd)
#   3. UMBRELLA         — the legal vehicle hosting the sub-funds (iShares III plc)
#   4. SUB-FUND         — the specific fund strategy (iShares Core MSCI World UCITS ETF)
#   5. SHARE CLASS      — the tradable instrument (USD Acc, ISIN IE00B4L5Y983)
#
# Each level is a separate legal/business entity with its own LEI (levels 1-3).
# FIRDS reports the **umbrella** LEI as the instrument's issuer LEI, so we
# query FIRDS by umbrellaLei. The other LEIs are looked up separately here
# (GLEIF is the eventual enrichment source).
#
# Verified by spot-checks against GLEIF + the BlackRock fund pages. The
# promoter is the group brand and intentionally does not carry an LEI here
# (BlackRock, Inc. as a US holding company has its own LEI, but it is the
# corporate parent, not a fund-industry registered entity for these funds).

issuers:

