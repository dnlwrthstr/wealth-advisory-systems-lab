# SIX Swiss Exchange ticker → ISIN map.
#
# The SIX listing of a CH-issued equity is NOT in ESMA FIRDS (Swiss
# issuers report to FINMA), and yfinance returns "-" for `.isin` on
# Swiss tickers. So we maintain a small curated table that lets the
# agentic platform resolve a Yahoo-suffixed Swiss ticker to its ISIN
# before the rest of the equity flow runs. Once the ISIN is on the
# record, equity_firds + valor derivation + issuer chaining all kick in.
#
# To extend: add `ticker: ISIN` pairs below. Verify each ISIN at the
# CLI with:
#   docker exec wealth-advisory-systems-lab-instrument-api-1 python -c \
#     "from pipeline.gold.equity_firds import fetch_by_isin; \
#      print(fetch_by_isin('CH...').get('longName'))"
# If the printed name matches the company, the ISIN is real.
#
# Source of truth: SIX Swiss Exchange product directory (six-group.com).
# Last verified: 2026-05-16.

