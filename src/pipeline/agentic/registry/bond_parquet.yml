id: bond_parquet
description: |
  Build a BondGolden from the FINFOX csv_terms parquet master. Real
  coupon + maturity + seniority + S&P-style rating per issuer. The
  primary bond path for the lab; FIRDS is a secondary fallback (not yet
  registered as an agentic source).
module: pipeline.agentic.sources.bond_parquet
entrypoint: fetch
covers: [bond]
requires_identifier:
  any_of: [isin]
produces_fields:
  - identifierList
  - longName
  - assetClass
  - assetClassId
  - seniority
  - countryOfRisk
  - currencyOfDenomination
  - maturityDate
  - couponType
  - currentCouponRate
  - minimumDenomination
  - lifecycleStatus
  - issuer
  - primaryListing
confidence: high
cost_class: file_read
