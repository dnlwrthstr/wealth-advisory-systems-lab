[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wealth-advisory-lab"
version = "0.1.0"
description = "Learning-oriented prototypes for wealth advisory systems, compliance monitoring, and AI governance."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.1.0",
  "fastapi>=0.115.0",
  "jupyter>=1.0.0",
  "numpy>=1.26.0",
  "pandas>=2.2.0",
  "psycopg[binary]>=3.2.0",
  "pyarrow>=15.0.0",
  "pydantic>=2.7.0",
  "pytest>=8.0.0",
  "PyYAML>=6.0",
  "lxml>=5.0.0",
  "opensearch-py>=2.6.0",
  "uvicorn[standard]>=0.30.0",
  "yfinance>=0.2.40",
]

[project.scripts]
ontology_2_pydantic = "ontology_tools.ontology_2_pydantic.convert_to_pydantic:main"
golden_record_2_opensearch = "ontology_tools.golden_record_2_opensearch.convert_to_opensearch:main"
equity_golden_from_yahoo = "pipeline.gold.equity_yahoo:main"
load_golden_to_opensearch = "pipeline.gold.load:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
