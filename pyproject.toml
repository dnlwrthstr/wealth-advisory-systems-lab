[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wealth-advisory-lab"
version = "0.1.0"
description = "Learning-oriented prototypes for wealth advisory systems, compliance monitoring, and AI governance."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.1.0",
  "fastapi>=0.115.0",
  "jupyter>=1.0.0",
  "numpy>=1.26.0",
  "pandas>=2.2.0",
  "psycopg[binary]>=3.2.0",
  "pyarrow>=15.0.0",
  "pydantic>=2.7.0",
  "pytest>=8.0.0",
  "uvicorn[standard]>=0.30.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
