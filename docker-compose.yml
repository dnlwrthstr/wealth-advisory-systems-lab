services:
  database:
    build:
      context: .
      dockerfile: db/Dockerfile
    environment:
      POSTGRES_DB: wealth_advisory
      POSTGRES_USER: wealth_advisory
      POSTGRES_PASSWORD: wealth_advisory
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wealth_advisory -d wealth_advisory"]
      interval: 5s
      timeout: 5s
      retries: 10

  custodian-api:
    build:
      context: .
      dockerfile: backend/custodian_api/Dockerfile
    environment:
      CUSTODIAN_DATA_PATH: /data/custodian
    volumes:
      - custodian-data:/data/custodian
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health').read()"]
      interval: 10s
      timeout: 5s
      retries: 5

  profile-api:
    build:
      context: .
      dockerfile: backend/profile_api/Dockerfile
    environment:
      DATABASE_URL: postgresql://wealth_advisory:wealth_advisory@database:5432/wealth_advisory
    ports:
      - "8002:8002"
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health').read()"]
      interval: 10s
      timeout: 5s
      retries: 5

  instrument-api:
    build:
      context: .
      dockerfile: backend/instrument_api/Dockerfile
    environment:
      OPENSEARCH_URL: http://opensearch:9200
      # API keys read from the project .env (gitignored). Agentic sources
      # skip silently when their key is unset, so omitting any of these
      # just narrows source coverage — nothing breaks.
      OPENFIGI_API_KEY: ${OPENFIGI_API_KEY:-}
      FINNHUB_API_KEY: ${FINNHUB_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      # Read-write mount of curated fund patches.
      #  * `fund_factsheet_patch` and `fund_lookthrough_skill` READ
      #    pre-curated patches from here.
      #  * `fund_factsheet_skill` WRITES the patch JSON produced by the
      #    find-and-parse-factsheet Claude Code skill back here, so the
      #    next run cache-hits without re-invoking the LLM.
      # Read-only would silently swallow the write and leave the cache
      # cold forever, which is what bit T011b on first deploy.
      - ./data/opensearch/golden/fund/patches:/app/data/opensearch/golden/fund/patches
      # Read-only mount of the Claude Code skills directory.
      # `fund_factsheet_skill` invokes the find-and-parse-factsheet skill
      # via `claude-agent-sdk`; the SDK auto-discovers skills from
      # `<cwd>/.claude/skills/` (cwd=/app inside the container). Without
      # this mount the LLM call runs blind — Claude attempts the work
      # without the skill's parsing playbook and rarely produces a
      # usable patch.
      - ./.claude/skills:/app/.claude/skills:ro
    ports:
      - "8003:8003"
    depends_on:
      opensearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8003/health').read()"]
      interval: 10s
      timeout: 5s
      retries: 5

  order-api:
    build:
      context: .
      dockerfile: backend/order_api/Dockerfile
    ports:
      - "8004:8004"
    environment:
      CUSTODIAN_BOOKING_URL: http://custodian-api:8001/custody/bookings
    depends_on:
      custodian-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8004/health').read()"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "3000:80"
    depends_on:
      custodian-api:
        condition: service_healthy
      profile-api:
        condition: service_healthy
      instrument-api:
        condition: service_healthy
      order-api:
        condition: service_healthy

  opensearch:
    image: opensearchproject/opensearch:2.18.0
    environment:
      cluster.name: wealth-advisory-lab
      node.name: opensearch
      discovery.type: single-node
      bootstrap.memory_lock: "true"
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -sS http://localhost:9200/_cluster/health | grep -E '\"status\":\"(green|yellow)\"'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  opensearch-init:
    image: curlimages/curl:8.11.0
    depends_on:
      opensearch:
        condition: service_healthy
    environment:
      OPENSEARCH_URL: http://opensearch:9200
    volumes:
      - ./data/opensearch/golden:/golden:ro
    entrypoint: ["sh", "/golden/create_indices.sh"]
    restart: "no"

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.18.0
    environment:
      OPENSEARCH_HOSTS: '["http://opensearch:9200"]'
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: "true"
    ports:
      - "5601:5601"
    depends_on:
      opensearch:
        condition: service_healthy

volumes:
  postgres-data:
  custodian-data:
  opensearch-data:
